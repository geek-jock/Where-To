openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: saves
    description: User travel saves
  - name: decisions
    description: Travel decisions generated by AI
  - name: scrape
    description: URL metadata scraping
  - name: trips
    description: Group trips
  - name: friends
    description: Bilateral friend saves sharing

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /saves:
    get:
      operationId: listSaves
      tags: [saves]
      summary: List all saves for the current user
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of saves
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Save"
    post:
      operationId: createSave
      tags: [saves]
      summary: Add a new travel save
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSaveBody"
      responses:
        "201":
          description: Save created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Save"

  /saves/{id}/tag:
    post:
      operationId: tagSave
      tags: [saves]
      summary: Generate AI tags for a save
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagSaveBody"
      responses:
        "200":
          description: Tagged save
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Save"

  /saves/{id}/geocode:
    post:
      operationId: geocodeSave
      tags: [saves]
      summary: Geocode a save
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Geocoded save
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Save"

  /saves/{id}:
    patch:
      operationId: updateSave
      tags: [saves]
      summary: Update a save
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSaveBody"
      responses:
        "200":
          description: Updated save
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Save"
    delete:
      operationId: deleteSave
      tags: [saves]
      summary: Delete a save
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /friends:
    get:
      operationId: listFriends
      tags: [friends]
      summary: List connected friends (accepted bilateral shares)
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of friends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Friend"

  /friends/request:
    post:
      operationId: sendFriendRequest
      tags: [friends]
      summary: Send a save-sharing request to another user by email
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendFriendRequestBody"
      responses:
        "201":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveShareRequest"

  /friends/requests:
    get:
      operationId: listFriendRequests
      tags: [friends]
      summary: List pending incoming share requests
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SaveShareRequestWithSender"

  /friends/requests/{id}:
    patch:
      operationId: respondFriendRequest
      tags: [friends]
      summary: Accept or decline a pending share request
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondFriendRequestBody"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveShareRequest"

  /friends/{userId}:
    delete:
      operationId: revokeFriendShare
      tags: [friends]
      summary: Revoke sharing with a friend
      security:
        - clerkAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /friends/{userId}/saves:
    get:
      operationId: getFriendSaves
      tags: [friends]
      summary: Get a connected friend's saves (read-only)
      security:
        - clerkAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Friend's saves
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Save"

  /decisions:
    post:
      operationId: createDecision
      tags: [decisions]
      summary: Create a new AI travel decision
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDecisionBody"
      responses:
        "201":
          description: Decision created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
    get:
      operationId: listDecisions
      tags: [decisions]
      summary: List all decisions for the current user
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of decisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Decision"

  /decisions/{id}:
    get:
      operationId: getDecision
      tags: [decisions]
      summary: Get a specific decision
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Decision detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
    delete:
      operationId: deleteDecision
      tags: [decisions]
      summary: Delete a decision
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Decision deleted

  /trips:
    get:
      operationId: listTrips
      tags: [trips]
      summary: List all trips for the current user
      security:
        - clerkAuth: []
      responses:
        "200":
          description: List of trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trip"
    post:
      operationId: createTrip
      tags: [trips]
      summary: Create a new trip
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTripBody"
      responses:
        "201":
          description: Trip created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"

  /trips/{id}:
    get:
      operationId: getTrip
      tags: [trips]
      summary: Get trip detail (requires membership or valid invite token)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: invite
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Trip detail with members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDetail"

  /trips/{id}/decisions:
    get:
      operationId: listGroupDecisions
      tags: [trips]
      summary: List decision rooms for a trip
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: invite
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of group decisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupDecision"
    post:
      operationId: createGroupDecision
      tags: [trips]
      summary: Create a decision room (coordinator only)
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupDecisionBody"
      responses:
        "201":
          description: Decision created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDecision"

  /trips/{id}/decisions/{decId}:
    get:
      operationId: getGroupDecision
      tags: [trips]
      summary: Get a decision room with comments and members
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: decId
          in: path
          required: true
          schema:
            type: integer
        - name: invite
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Decision room detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDecisionDetail"

  /trips/{id}/decisions/{decId}/comments:
    post:
      operationId: createDecisionComment
      tags: [trips]
      summary: Post a comment in a decision room
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: decId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentBody"
      responses:
        "201":
          description: Comment posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionComment"

  /trips/{id}/decisions/{decId}/run-verdict:
    post:
      operationId: runGroupVerdict
      tags: [trips]
      summary: Run AI group verdict (coordinator only)
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: decId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated decision with verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDecisionDetail"

  /trips/{id}/decisions/{decId}/assign:
    patch:
      operationId: assignGroupDecision
      tags: [trips]
      summary: Assign a decision to a member (coordinator only)
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: decId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignDecisionBody"
      responses:
        "200":
          description: Updated decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDecisionDetail"

  /trips/{id}/decisions/{decId}/confirm:
    patch:
      operationId: confirmGroupDecision
      tags: [trips]
      summary: Confirm a decision as booked
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: decId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Decision marked done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDecisionDetail"

  /trips/{id}/decisions/{decId}/nudge:
    post:
      operationId: nudgeDecisionAssignee
      tags: [trips]
      summary: Send an in-app nudge to the assignee (coordinator only)
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: decId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201":
          description: Notification created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripNotification"

  /trips/{id}/decisions/{decId}/meta:
    patch:
      operationId: updateGroupDecisionMeta
      tags: [trips]
      summary: Update cost per pax and confirmation link (coordinator only)
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: decId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupDecisionMetaBody"
      responses:
        "200":
          description: Updated decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDecision"

  /trips/{id}/overview:
    get:
      operationId: getTripOverview
      tags: [trips]
      summary: Get trip overview (booked items, need-to-book, rough guide, notes)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: invite
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Trip overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripOverview"

  /trips/{id}/overview/notes:
    patch:
      operationId: updateTripOverviewNotes
      tags: [trips]
      summary: Update practical notes for the trip (coordinator only)
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOverviewNotesBody"
      responses:
        "200":
          description: Updated notes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewNotes"

  /trips/{id}/notifications:
    get:
      operationId: getTripNotifications
      tags: [trips]
      summary: Get notifications for current user in this trip
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripNotification"

  /trips/{id}/notifications/read-all:
    patch:
      operationId: markTripNotificationsRead
      tags: [trips]
      summary: Mark all notifications as read for current user in this trip
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResult"

  /trips/{id}/join:
    post:
      operationId: joinTrip
      tags: [trips]
      summary: Join a trip via invite token
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinTripBody"
      responses:
        "200":
          description: Joined trip detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDetail"

  /scrape:
    post:
      operationId: scrapeUrl
      tags: [scrape]
      summary: Scrape metadata from a URL
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScrapeUrlBody"
      responses:
        "200":
          description: Scraped metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeResult"

components:
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Save:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        note:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        scrapedTitle:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        placeName:
          type: string
          nullable: true
        countryCode:
          type: string
          nullable: true
        lat:
          type: number
          nullable: true
        lng:
          type: number
          nullable: true
        tags:
          type: array
          nullable: true
          items:
            type: string
        category:
          type: string
          nullable: true
        officialLink:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - createdAt

    UpdateSaveBody:
      type: object
      properties:
        scrapedTitle:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        placeName:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        tags:
          type: array
          nullable: true
          items:
            type: string
        category:
          type: string
          nullable: true
        officialLink:
          type: string
          nullable: true

    CreateSaveBody:
      type: object
      properties:
        note:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        scrapedTitle:
          type: string
          nullable: true
        description:
          type: string
          nullable: true

    VerdictJson:
      type: object
      properties:
        type:
          type: string
          enum: [choose, structure]
        verdict:
          type: string
        travelPatterns:
          type: array
          items:
            type: string
          minItems: 3
          maxItems: 3
        coreConflict:
          type: string
        whatYoureMissing:
          type: string
        whyThisFits:
          type: string
        tradeoffs:
          type: string
        avoidIf:
          type: array
          items:
            type: string
        nextMove:
          type: string
        anchors:
          type: array
          items:
            type: string
          minItems: 3
          maxItems: 3
        timingConfidence:
          type: string
        stopDoingThis:
          type: string
        usedSaveIds:
          type: array
          items:
            type: integer
      required:
        - type
        - verdict
        - travelPatterns
        - coreConflict
        - whatYoureMissing
        - whyThisFits
        - tradeoffs
        - avoidIf
        - nextMove
        - anchors
        - timingConfidence
        - stopDoingThis
        - usedSaveIds

    Decision:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        question:
          type: string
        result:
          type: string
        resultJson:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/VerdictJson"
        savesSnapshot:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - question
        - result
        - savesSnapshot
        - createdAt

    CreateDecisionBody:
      type: object
      properties:
        question:
          type: string
      required:
        - question

    DeleteResult:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    SaveShareRequest:
      type: object
      properties:
        id:
          type: integer
        fromUserId:
          type: string
        toEmail:
          type: string
        toUserId:
          type: string
          nullable: true
        status:
          type: string
          enum: [pending, accepted, declined, revoked]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - fromUserId
        - toEmail
        - status
        - createdAt

    SaveShareRequestWithSender:
      allOf:
        - $ref: "#/components/schemas/SaveShareRequest"
        - type: object
          properties:
            senderEmail:
              type: string
              nullable: true

    Friend:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
      required:
        - userId

    SendFriendRequestBody:
      type: object
      properties:
        email:
          type: string
      required:
        - email

    RespondFriendRequestBody:
      type: object
      properties:
        action:
          type: string
          enum: [accept, decline]
      required:
        - action

    ScrapeUrlBody:
      type: object
      properties:
        url:
          type: string
      required:
        - url

    TagSaveBody:
      type: object
      properties:
        extractedText:
          type: string
          nullable: true

    TripMember:
      type: object
      properties:
        tripId:
          type: integer
        userId:
          type: string
        role:
          type: string
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        joinedAt:
          type: string
          format: date-time
      required:
        - tripId
        - userId
        - role
        - joinedAt

    Trip:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        destination:
          type: string
          nullable: true
        startDate:
          type: string
          nullable: true
        endDate:
          type: string
          nullable: true
        coordinatorId:
          type: string
        inviteToken:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - coordinatorId
        - inviteToken
        - createdAt

    TripDetail:
      allOf:
        - $ref: "#/components/schemas/Trip"
        - type: object
          properties:
            members:
              type: array
              items:
                $ref: "#/components/schemas/TripMember"
            currentUserRole:
              type: string
              nullable: true
            isGuest:
              type: boolean
            openDecisionCount:
              type: integer
            lastActivityAt:
              type: string
              format: date-time
          required:
            - members
            - isGuest
            - openDecisionCount
            - lastActivityAt

    CreateTripBody:
      type: object
      properties:
        name:
          type: string
        destination:
          type: string
          nullable: true
        startDate:
          type: string
          nullable: true
        endDate:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
      required:
