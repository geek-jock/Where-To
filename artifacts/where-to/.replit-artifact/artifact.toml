kind = "web"
previewPath = "/"
title = "Where To"
version = "1.0.0"
id = "artifacts/where-to"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21055

[services.development]
run = "pnpm --filter @workspace/where-to run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/where-to", "run", "build" ]
publicDir = "artifacts/where-to/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21055"
BASE_PATH = "/"
